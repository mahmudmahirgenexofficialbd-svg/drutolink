<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/mahmudmahirgenexofficialbd-svg/drutolink/main/logo.png?v=2" />
    <title>DrutoLink - China to Bangladesh Wholesale Sourcing,DrutoLink - চীন থেকে পণ্য আমদানি, পাইকারি সোর্সিং ও শিপিং সার্ভিস বাংলাদেশে
    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // font-display / font-body ক্লাসগুলো আগে কোথাও ডিফাইন করা ছিল না, তাই পুরো সাইট
      // ব্রাউজারের ডিফল্ট ফন্টে দেখাচ্ছিল — এখন Poppins + Hind Siliguri যোগ করা হলো
      // (একই ফন্ট-স্ট্যাকে দুটো থাকায় বাংলা ও ইংরেজি দুটোই নিজের ভাষার হরফে সঠিকভাবে দেখাবে)
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ['Poppins', 'Hind Siliguri', 'sans-serif'],
              body: ['Hind Siliguri', 'Poppins', 'sans-serif'],
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-gray-50 font-body">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
